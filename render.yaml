services:
  - type: web
    name: super-graphic
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/media
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VITE_MEDIA_BACKEND
        value: server
      - key: MONGODB_DATABASE
        value: supergraphic
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
